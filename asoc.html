<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moneda Giratoria METHAURUM</title>
    <link rel="stylesheet" href="css/aso.css">
</head>
<body>
    <div class="coin-container">
        <div class="coin" id="coin">
            <!-- Cara frontal de la moneda -->
            <div class="coin-face front">
                <svg viewBox="0 0 500 500" width="100%" height="100%">
                    <defs>
                        <!-- Gradiente dorado para la moneda -->
                        <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f9d976" />
                            <stop offset="30%" stop-color="#e9b646" />
                            <stop offset="50%" stop-color="#fff1b0" />
                            <stop offset="70%" stop-color="#c1932e" />
                            <stop offset="100%" stop-color="#8a640f" />
                        </linearGradient>
                        <!-- Gradiente para el relieve oscuro/profundidad -->
                        <linearGradient id="dark-gold" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#8a640f" />
                            <stop offset="100%" stop-color="#4a3504" />
                        </linearGradient>
                        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.6"/>
                        </filter>
                    </defs>

                    <!-- Cuerpo base de la moneda -->
                    <circle cx="250" cy="250" r="230" fill="url(#gold-grad)" stroke="#684c0b" stroke-width="4" />
                    <!-- Borde interior ranurado o biselado -->
                    <circle cx="250" cy="250" r="222" fill="none" stroke="#fff1b0" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
                    <circle cx="250" cy="250" r="218" fill="none" stroke="#684c0b" stroke-width="1.5" />

                    <!-- Estructura geométrica de la gran "A" (Inspirada en el logotipo) -->
                    <path d="M 250 60 L 410 390 L 350 390 L 250 170 L 150 390 L 90 390 Z" fill="url(#dark-gold)" opacity="0.15" />
                    <path d="M 250 70 L 400 380 L 360 380 L 250 190 L 140 380 L 100 380 Z" fill="url(#gold-grad)" filter="url(#shadow)" />

                    <!-- Elemento Químico 'Au' en relieve -->
                    <text x="250" y="240" font-family="'Cinzel', 'Georgia', serif" font-size="75" font-weight="bold" fill="url(#dark-gold)" text-anchor="middle" filter="url(#shadow)">Au</text>

                    <!-- Masa Atómica / Detalles a la derecha -->
                    <text x="365" y="370" font-family="sans-serif" font-size="14" font-weight="bold" fill="#523b07">79</text>

                    <!-- Texto METHAURUM en la parte inferior, arqueado sutilmente o centrado abajo -->
                    <text x="250" y="340" font-family="'Cinzel', 'Georgia', serif" font-size="24" font-weight="bold" fill="#4a3504" letter-spacing="4" text-anchor="middle">METHAURUM</text>
                </svg>
            </div>
            
            <!-- Cara posterior de la moneda (Cruz) -->
            <div class="coin-face back">
                <svg viewBox="0 0 500 500" width="100%" height="100%">
                    <!-- Cuerpo base trasero -->
                    <circle cx="250" cy="250" r="230" fill="url(#gold-grad)" stroke="#684c0b" stroke-width="4" />
                    <circle cx="250" cy="250" r="222" fill="none" stroke="#fff1b0" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
                    <circle cx="250" cy="250" r="218" fill="none" stroke="#684c0b" stroke-width="1.5" />

                    <!-- Reutilizando la misma silueta de la A de manera inversa/simétrica o como sello trasero -->
                    <path d="M 250 80 L 390 370 L 110 370 Z" fill="none" stroke="#8a640f" stroke-width="3" opacity="0.3" />
                    
                    <!-- Un escudo circular interno sutil -->
                    <circle cx="250" cy="250" r="130" fill="none" stroke="#684c0b" stroke-width="2" stroke-dasharray="8,4" opacity="0.5" />
                    
                    <!-- Isotipo simplificado central -->
                    <text x="250" y="275" font-family="'Cinzel', 'Georgia', serif" font-size="110" font-weight="bold" fill="url(#dark-gold)" text-anchor="middle" filter="url(#shadow)">A</text>
                    <text x="250" y="320" font-family="'Cinzel', 'Georgia', serif" font-size="14" font-weight="bold" fill="#4a3504" letter-spacing="6" text-anchor="middle">🟡aupo🟡 </text>
                </svg>
            </div>
        </div>
    </div>

    <!-- Instrucción de interacción -->
    <div class="instruction">Haz clic en la moneda para pausar o reanudar el giro</div>

    <script src="script/asoc.js"></script>
</body>
</html>
