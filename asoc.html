<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moneda METHAURUM 3D</title>
    <link rel="stylesheet" href="css/aso.css">
</head>
<body>
    <div class="coin-container" id="coinContainer">
        <div class="coin" id="coin">
            <!-- CARA FRONTAL (Anverso) -->
            <div class="coin-face coin-front">
                <svg viewBox="0 0 200 200" width="100%" height="100%">
                    <defs>
                        <radialGradient id="gold" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffe891"/>
                            <stop offset="70%" stop-color="#d4af37"/>
                            <stop offset="100%" stop-color="#aa8010"/>
                        </radialGradient>
                    </defs>
                    <!-- Cuerpo Moneda -->
                    <circle cx="100" cy="100" r="96" fill="url(#gold)" stroke="#aa8010" stroke-width="2"/>
                    <circle cx="100" cy="100" r="91" fill="none" stroke="#ffe891" stroke-width="1" stroke-dasharray="2,2"/>
                    
                    <!-- Textos Periféricos (Curvos) -->
                    <path id="frontTopPath" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
                    <path id="frontBottomPath" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
                    <text font-family="serif" font-weight="bold" font-size="15" fill="#5c4308" text-anchor="middle">
                        <textPath href="#frontTopPath" startOffset="50%">AUPO</textPath>
                    </text>
                    <text font-family="serif" font-weight="bold" font-size="15" fill="#5c4308" text-anchor="middle">
                        <textPath href="#frontBottomPath" startOffset="50%">GOLD</textPath>
                    </text>
                    
                    <!-- Textos Laterales -->
                    <text x="24" y="105" font-family="serif" font-size="14" font-weight="bold" fill="#5c4308" text-anchor="middle">r</text>
                    <text x="176" y="105" font-family="serif" font-size="14" font-weight="bold" fill="#5c4308" text-anchor="middle">q</text>
                    
                    <!-- Icono Central (Letra A geométrica y Au) -->
                    <polygon points="100,32 145,135 125,135 100,75 75,135 55,135" fill="#7a5807"/>
                    <text x="100" y="118" font-family="serif" font-size="34" font-weight="bold" fill="#ffe891" font-style="italic" text-anchor="middle">Au</text>
                </svg>
            </div>

            <!-- CARA TRASERA (Reverso) -->
            <div class="coin-face coin-back">
                <svg viewBox="0 0 200 200" width="100%" height="100%">
                    <circle cx="100" cy="100" r="96" fill="url(#gold)" stroke="#aa8010" stroke-width="2"/>
                    <circle cx="100" cy="100" r="91" fill="none" stroke="#ffe891" stroke-width="1" stroke-dasharray="2,2"/>
                    
                    <!-- Textos Periféricos -->
                    <path id="backTopPath" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
                    <path id="backBottomPath" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
                    <text font-family="serif" font-weight="bold" font-size="20" fill="#5c4308" text-anchor="middle">
                        <textPath href="#backTopPath" startOffset="50%">π</textPath>
                    </text>
                    <text font-family="serif" font-weight="bold" font-size="15" fill="#5c4308" text-anchor="middle">
                        <textPath href="#backBottomPath" startOffset="50%">88829</textPath>
                    </text>
                    
                    <!-- Iconos Laterales -->
                    <text x="24" y="105" font-family="serif" font-size="15" fill="#5c4308" text-anchor="middle">⚡</text>
                    <text x="176" y="105" font-family="serif" font-size="12" font-weight="bold" fill="#5c4308" text-anchor="middle">479</text>
                    
                    <!-- Centro: Número 5 grande -->
                    <text x="100" y="125" font-family="serif" font-size="75" font-weight="bold" fill="#7a5807" text-anchor="middle">5</text>
                </svg>
            </div>
        </div>
    </div>
    <script src="script/asoc.js"></script>
</body>
</html>
