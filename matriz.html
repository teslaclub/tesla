<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Escalera Eléctrica - Matriz Oro</title>
    <!-- CDN Oficial de Bootstrap v5.3.8 -->
    <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Tu archivo CSS Personalizado -->
    <link rel="stylesheet" href="css/css.css">
  </head>
  <body>

    <div class="container py-5">
        <!-- Encabezado del Sistema -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center border-bottom border-secondary pb-4 mb-5">
            <div>
                <h1 class="fw-black text-warning tracking-tight">👑 Sistema de Matriz Cíclica</h1>
                <p class="text-muted mb-0">Simulación en tiempo real y vista interactiva en escalera de peldaños</p>
            </div>
            <div class="bg-dark border border-secondary rounded p-3 mt-3 mt-md-0 text-center text-md-end">
                <small class="text-muted d-block text-uppercase font-monospace" style="font-size: 0.7rem;">Valor de Control Fijo:</small>
                <span class="fs-5 fw-bold text-success font-monospace">5g Oro = $900.00 USD</span>
            </div>
        </div>

        <div class="row g-4">
            <!-- COLUMNA IZQUIERDA: Tabla Técnica de Auditoría -->
            <div class="col-lg-6">
                <div class="card card-custom p-4 shadow h-100">
                    <h3 class="fs-5 fw-bold text-white mb-3 d-flex align-items-center">
                        <span class="badge bg-primary me-2 font-monospace fs-6">TABLA</span> Auditoría Operacional
                    </h3>
                    <div class="table-responsive">
                        <table class="table table-custom align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Aportantes</th>
                                    <th>Beneficiario</th>
                                    <th>Premio Asignado</th>
                                    <th class="text-end">Fondo Red</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-matriz-body">
                                <!-- Elementos inyectados dinámicamente por script.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: Escalera Eléctrica Visual -->
            <div class="col-lg-6">
                <div class="card card-custom p-4 shadow h-100">
                    <h3 class="fs-5 fw-bold text-white mb-4 d-flex align-items-center">
                        <span class="badge bg-warning text-dark me-2 font-monospace fs-6">VISUAL</span> Escalera Eléctrica Progresiva
                    </h3>
                    
                    <div class="overflow-auto w-100 p-1">
                        <div id="escalera-dinamica" class="contenedor-escalera d-flex flex-column gap-3">
                            <!-- Elementos inyectados dinámicamente por script.js -->
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- API Bundle Oficial de Bootstrap v5.3.8 -->
    <script src="https://jsdelivr.net" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Tu archivo Lógico Personalizado -->
    <script src="script/script.js"></script>
  </body>
</html>
